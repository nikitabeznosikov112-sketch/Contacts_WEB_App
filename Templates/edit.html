<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Редактирование контакта</title>
    <style>body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        h1 { color: #333; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px; font-size: 16px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; }
        button:hover { background: #2980b9; }
        .back { display: inline-block; margin-top: 20px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Редактирование контакта</h1>
    <form action="/edit/{{ contact[0] }}" method="POST">
        <input type="text" name="name" value="{{ contact[1] }}" placeholder="Имя" required>
        <input type="text" name="phone" value="{{ contact[2] }}" placeholder="Телефон" required>
        <button type="submit">Сохранить</button>
    </form>

    <a href="/" class="back">Назад к списку</a>
</body>
</html>
