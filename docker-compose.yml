services:
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    ports: 
      - "8000:8000"
    env_file:
      - .env
    depends_on: 
      - db 

volumes:
  postgres_data: